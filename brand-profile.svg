<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.82" cy="0.88" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Brand-Hintergrund -->
  <rect width="1024" height="1024" fill="#0b1023"/>
  <rect width="1024" height="1024" fill="url(#glow1)"/>
  <rect width="1024" height="1024" fill="url(#glow2)"/>

  <!-- Orbit-Ring (Motion-Feeling) -->
  <circle cx="512" cy="512" r="350" fill="none" stroke="#6366F1" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="10 16"/>
  <circle cx="512" cy="162" r="8" fill="url(#brand)"/>
  <circle cx="862" cy="512" r="5.5" fill="#8B5CF6" opacity="0.85"/>
  <circle cx="196" cy="668" r="4.5" fill="#a5b4fc" opacity="0.7"/>

  <!-- Funkelsparks -->
  <circle cx="268" cy="230" r="4" fill="#8B5CF6" opacity="0.65"/>
  <circle cx="802" cy="196" r="3.5" fill="#6366F1" opacity="0.7"/>
  <circle cx="868" cy="700" r="4" fill="#a5b4fc" opacity="0.55"/>

  <!-- Logo-Kachel mit Glow -->
  <rect x="308" y="308" width="408" height="408" rx="92" fill="url(#brand)" filter="url(#soft)" opacity="0.6"/>
  <rect x="312" y="312" width="400" height="400" rx="90" fill="url(#brand)"/>
  <text x="512" y="521" font-family="Arial, Helvetica, sans-serif" font-size="252" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">M</text>
</svg>
