<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTION//MEDIA — VIEWS Ad Spot (Apple Style, TikTok 9:16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#00e5ff; --bg:#08080a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'JetBrains Mono',Consolas,monospace;color:#cfcfda}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#000;max-width:100vw;aspect-ratio:9/16}
  #hud{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;
       background:linear-gradient(0deg,rgba(4,4,6,.95),transparent)}
  .btn{cursor:pointer;border:1px solid #2a2a33;background:#0c0c10;font-family:'JetBrains Mono',monospace;font-size:12px;
       letter-spacing:.14em;padding:9px 15px;text-transform:uppercase;transition:.15s;user-select:none}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.rec{border-color:#5a1520;color:#ff3355}
  .btn.rec.active{background:#ff3355;color:#0a0004;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}
  #timeline{flex:1;height:3px;background:#1c1c22;position:relative;cursor:pointer}
  #timeline .fill{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,var(--accent),#ff2fb9)}
  #tc{font-size:11px;letter-spacing:.1em;min-width:110px;text-align:right;color:#8a8a98}
  #startOverlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;
       background:rgba(3,3,5,.88);backdrop-filter:blur(6px);transition:opacity .4s}
  #startOverlay.hidden{opacity:0;pointer-events:none}
  .brand{font-family:'Inter',Impact,sans-serif;font-weight:800;font-size:clamp(26px,4.6vw,48px);letter-spacing:.06em;color:#fff;text-transform:uppercase}
  .brand em{font-style:normal;color:var(--accent)}
  .big{cursor:pointer;border:1px solid #2a2a33;background:linear-gradient(180deg,#101014,#0a0a0d);font-family:'Inter',Impact,sans-serif;
       font-weight:700;font-size:clamp(26px,3.6vw,42px);letter-spacing:.16em;padding:13px 44px 10px;transition:.18s;color:#fff}
  .big:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);box-shadow:0 0 34px rgba(0,229,255,.35)}
  .hint{color:#6a6a78;font-size:11px;letter-spacing:.24em;text-transform:uppercase;text-align:center;line-height:2}
</style>
</head>
<body>

<div id="wrap"><canvas id="stage" width="1080" height="1920"></canvas></div>

<div id="hud">
  <span class="btn" id="playBtn">⏸ pause</span>
  <span class="btn" id="restartBtn">⟲ restart</span>
  <span class="btn rec" id="recBtn">● record → webm</span>
  <div id="timeline"><div class="fill"></div></div>
  <span id="tc">00:00 / 00:15</span>
</div>

<div id="startOverlay">
  <div class="brand">MOTION<em>//</em>MEDIA</div>
  <button class="big" id="startBtn">▶&nbsp; SPOT AB SPIELEN</button>
  <div class="hint">Fast Cut · Diagramme · Musik + SFX · „Made with purpose" · 15 s Render mit Ton</div>
</div>

<script>
/* ================================================================
   MOTION//MEDIA — "VIEWS" TikTok Spot, Apple-Style  v3
   - kein View-Counter mehr (direkt rein, schneller Cut-Rhythmus)
   - leichte Musik (synth Pluck-Pattern, Pads, Hats) + SFX
   - 1080x1920 / 30fps / 15s / record -> webm (video + audio)
================================================================ */
const cv  = document.getElementById('stage');
const ctx = cv.getContext('2d');
const CW = 1080, CH = 1920, DUR = 15.0;
const COUNTER_TARGET = 524000;   // <- deine Views-Zahl (Anzeige: 524K+)
const GROWTH_PCT     = 847;

const CYAN = '#00e5ff';
const GRAY = '#9aa0aa';
const loadFontReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

/* ---------------- timeline (schneller Cut-Rhythmus) ---------------- */
const CROSS = 0.22;
const T_LINE = 4.20, T_LINE_END = 6.60;   // Line-Chart (white)
const T_BARS = 6.60, T_BARS_END = 8.80;   // Bar-Chart (black)
const T_END = 11.00;                      // Endcard
const CUTS = [2.20, 4.20, 6.60, 8.80, 11.00];
const SHOTS = [
  { t0: 0.00, t1: 2.20, white:true,  text:'Deine Videos.',           fadeIn:0.25 },
  { t0: 2.20, t1: 4.20, white:false, text:'Unsere Motion.',         fadeIn:0.20 },
  { t0: 8.80, t1:11.00, white:true,  text:'Made with purpose.', accentWord:'purpose.', size:102, fadeIn:0.20 }
];

/* ---------------- easing / helpers ---------------- */
const clamp01 = x => Math.min(1, Math.max(0, x));
const appleOut = e => 1 - Math.pow(1 - e, 5);
function fadeInOut(t, t0, t1, fi, fo){
  return Math.min(clamp01((t - t0) / fi), clamp01((t1 - t) / fo));
}
function fmtViews(n){
  let s = ''+Math.round(n), o='';
  while(s.length>3){ o = '.'+s.slice(-3)+o; s = s.slice(0,-3); }
  return s+o;
}
function setFont(weight, px, mono){
  ctx.font = weight + ' ' + px + 'px ' + (mono ? '"JetBrains Mono", Consolas, monospace' : 'Inter, "Segoe UI", Arial');
}
function centerText(txt, x, y, size, color, opts){
  opts = opts || {};
  ctx.save();
  ctx.globalAlpha = opts.alpha != null ? opts.alpha : 1;
  ctx.fillStyle = color;
  setFont(opts.weight || 800, size, opts.mono);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = (opts.track != null ? opts.track : 0) + 'px';
  ctx.fillText(txt, x, y);
  ctx.restore();
}

/* ================================================================
   AUDIO-ENGINE: leichte Musik (synth) + SFX
   master -> Lautsprecher UND Record-Stream
================================================================ */
let AC = null, master = null, streamDest = null, noiseBuf = null;
function ensureAudio(){
  if(AC){ AC.resume && AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.55;
  streamDest = AC.createMediaStreamDestination();
  master.connect(AC.destination);
  master.connect(streamDest);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
}
function env(g, t0, a, peak, d){
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+a+d);
}
/* --- Musik-Instrumente --- */
function notePluck(freq, vol){
  if(!AC) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
  o.type = 'triangle'; o.frequency.value = freq;
  lp.type = 'lowpass'; lp.frequency.value = 2600;
  env(g, t0, 0.006, vol, 0.35);
  o.connect(lp).connect(g).connect(master); o.start(t0); o.stop(t0+0.45);
}
function noteHat(vol){
  if(!AC) return;
  const t0 = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 7000;
  const g = AC.createGain();
  env(g, t0, 0.001, vol, 0.03);
  src.connect(hp).connect(g).connect(master); src.start(t0); src.stop(t0+0.06);
}
function noteKick(vol){ // sanft
  if(!AC) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(110, t0);
  o.frequency.exponentialRampToValueAtTime(46, t0+0.14);
  env(g, t0, 0.004, vol, 0.16);
  o.connect(g).connect(master); o.start(t0); o.stop(t0+0.3);
}
function notePad(chord, dur, vol){
  if(!AC) return;
  const t0 = AC.currentTime;
  chord.forEach((f, i) => {
    const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = 'sine'; o.frequency.value = f * (i===1 ? 2 : 1);
    lp.type='lowpass'; lp.frequency.value=1800;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(lp).connect(g).connect(master); o.start(t0); o.stop(t0+dur+0.1);
  });
}
function noteChime(){ // Endcard-Akkord
  if(!AC) return;
  notePad([261.63, 329.63, 392.0, 523.25], 1.8, 0.09);
  setTimeout(()=>{ notePluck(1046.5, 0.08); }, 120);
}
/* --- SFX --- */
function sfxWhoosh(dir){
  if(!AC) return;
  const t0 = AC.currentTime, dur = 0.40;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(dir>0 ? 260 : 2600, t0);
  bp.frequency.exponentialRampToValueAtTime(dir>0 ? 2600 : 260, t0+dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.20, t0+dur*0.45);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(bp).connect(g).connect(master);
  src.start(t0); src.stop(t0+dur+0.05);
}
function sfxThud(){
  if(!AC) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(120, t0);
  o.frequency.exponentialRampToValueAtTime(42, t0+0.22);
  env(g, t0, 0.005, 0.45, 0.26);
  o.connect(g).connect(master); o.start(t0); o.stop(t0+0.4);
}
function sfxPop(){
  if(!AC) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(560, t0);
  o.frequency.exponentialRampToValueAtTime(170, t0+0.07);
  env(g, t0, 0.003, 0.3, 0.09);
  o.connect(g).connect(master); o.start(t0); o.stop(t0+0.15);
}
function sfxTap(){
  if(!AC) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='triangle'; o.frequency.value = 880;
  env(g, t0, 0.003, 0.16, 0.14);
  o.connect(g).connect(master); o.start(t0); o.stop(t0+0.2);
}
function sfxRiser(dur){
  if(!AC) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(180, t0);
  o.frequency.exponentialRampToValueAtTime(950, t0+dur);
  const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.14, t0+dur);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur+0.08);
  o.connect(lp).connect(g).connect(master); o.start(t0); o.stop(t0+dur+0.1);
}
function sfxHit(){ sfxThud(); sfxWhoosh(1); setTimeout(()=>{ noteChime(); }, 80); }

/* --- Director-Events: Musik-Pattern + SFX an exakten Timeline-Zeiten --- */
const BEAT = 0.485; // ~124 BPM
const CHORDS = [ // Am – F – C – G (leicht, lofi-artig)
  [220.00, 261.63, 329.63],
  [174.61, 220.00, 349.23],
  [261.63, 329.63, 392.00],
  [196.00, 246.94, 392.00]
];
const RIFF = [659.25, 523.25, 440.00, 523.25]; // E5 C5 A4 C5 - verschlafen
const EVENTS = [];
// Musik über die ganze Länge
(function buildMusic(){
  let bar = 0;
  for(let tB = 0.05; tB < DUR - 0.5; tB += BEAT){
    const bi = Math.round((tB - 0.05)/BEAT);
    // Pad bei jedem 4. Beat
    if(bi % 4 === 0){
      const ch = CHORDS[(bi/4) % CHORDS.length];
      EVENTS.push({t: tB, fn: ()=>notePad(ch, BEAT*3.6, 0.055)});
    }
    // Riff-Pluck auf jedem Beat, Kick auf geraden Beats
    EVENTS.push({t: tB, fn: (()=>{const f=RIFF[bi%RIFF.length]; return ()=>notePluck(f, 0.09);})()});
    if(bi % 2 === 0) EVENTS.push({t: tB, fn: ()=>noteKick(0.16)});
    // Hats auf Offbeats
    EVENTS.push({t: tB + BEAT/2, fn: ()=>noteHat(0.035)});
    bar++;
  }
})();
// SFX
CUTS.forEach(ct => EVENTS.push({t:ct, fn:()=>{ sfxWhoosh(-1); }}));
[0.05, 2.30, 8.90].forEach(t => EVENTS.push({t, fn:sfxThud}));
EVENTS.push({t:5.85, fn:sfxTap});                       // Line-Chart fertig
for(let i=0;i<6;i++) EVENTS.push({t:6.72 + i*0.14, fn:sfxPop}); // Bars schneller
EVENTS.push({t:10.30, fn:()=>sfxRiser(0.65)});
EVENTS.push({t:11.02, fn:sfxHit});
EVENTS.sort((a,b)=>a.t-b.t);
let evIdx = 0;
function syncEvIdx(){
  evIdx = 0;
  while(evIdx < EVENTS.length && EVENTS[evIdx].t <= t) evIdx++;
}

/* ---------------- player ---------------- */
let t = 0, playing = false, last = 0, raf = null;
const playBtn = document.getElementById('playBtn');
const tcEl    = document.getElementById('tc');
const fillEl  = document.querySelector('#timeline .fill');
const tlEl    = document.getElementById('timeline');

function loop(now){
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  if(playing){
    const prev = t;
    t += dt;
    if(AC){
      while(evIdx < EVENTS.length && EVENTS[evIdx].t <= t && EVENTS[evIdx].t >= prev){ EVENTS[evIdx].fn(); evIdx++; }
    }
    if(t >= DUR){ t = DUR; playing = false; playBtn.textContent = '▶ play'; }
  }
  render(t); updateHud();
  raf = requestAnimationFrame(loop);
}
function updateHud(){
  fillEl.style.width = (t/DUR*100)+'%';
  tcEl.textContent = '00:'+String(Math.floor(t)).padStart(2,'0')+' / 00:15';
}
document.getElementById('playBtn').onclick = () => {
  ensureAudio();
  if(t >= DUR) t = 0;
  playing = !playing; last = performance.now();
  if(playing) syncEvIdx();
  playBtn.textContent = playing ? '⏸ pause' : '▶ play';
};
document.getElementById('restartBtn').onclick = () => {
  ensureAudio(); t = 0; last = performance.now();
  if(!playing){ playing = true; playBtn.textContent = '⏸ pause'; }
  syncEvIdx();
};
tlEl.onclick = e => {
  const r = tlEl.getBoundingClientRect();
  t = clamp01((e.clientX - r.left)/r.width) * DUR;
  syncEvIdx();
};

/* ================================================================
   RENDER
================================================================ */
function render(time){
  ctx.fillStyle = '#020203'; ctx.fillRect(0,0,CW,CH);
  const inWhiteScene = SHOTS.some(sh => sh.white && time >= sh.t0-0.05 && time <= sh.t1+0.15)
                     || (time >= T_LINE-0.12 && time <= T_LINE_END+0.12);
  if(inWhiteScene){ ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,CW,CH); ctx.globalAlpha = 1; }

  // ---- Statements ----
  for(const sh of SHOTS){
    const a = fadeInOut(time, sh.t0, sh.t1, sh.fadeIn || CROSS, CROSS);
    if(a <= 0) continue;
    const d = sh.t1 - sh.t0, pr = appleOut(clamp01((time - sh.t0)/d));
    const scale = 1.10 - 0.08*pr;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(CW/2, 880 + pr*22);
    ctx.scale(scale, scale);
    setFont(800, sh.size || 150, false);
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.letterSpacing='-4px';
    const full = sh.text;
    const pre  = sh.accentWord ? full.slice(0, full.length - sh.accentWord.length) : full;
    const wPre = ctx.measureText(pre).width;
    const wAll = ctx.measureText(full).width;
    ctx.fillStyle = sh.white ? '#050507' : '#ffffff';
    ctx.fillText(pre, -wAll/2, 0);
    if(sh.accentWord){ ctx.fillStyle = CYAN; ctx.fillText(sh.accentWord, -wAll/2 + wPre, 0); }
    ctx.restore();
  }

  // ---- Line-Chart (white) ----
  if(time > T_LINE - 0.12 && time < T_LINE_END + 0.25){
    const a = fadeInOut(time, T_LINE+0.05, T_LINE_END, 0.24, 0.24);
    if(a > 0){
      ctx.save();
      ctx.globalAlpha = a;

      // Headline "+847."
      const e1 = appleOut(clamp01((time - (T_LINE+0.12))/0.45));
      const sc1 = 1.12 - 0.12*e1;
      ctx.save();
      ctx.translate(CW/2, 480); ctx.scale(sc1, sc1);
      setFont(800, 200, false);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.letterSpacing='-6px';
      ctx.fillStyle='#050507';
      ctx.fillText('+'+GROWTH_PCT+'.', 0, 0);
      ctx.fillStyle = CYAN; ctx.font = '800 54px Inter, Segoe UI'; ctx.letterSpacing='2px';
      ctx.textAlign='left';
      ctx.fillText('MEHR VIEWS', -170, 130);
      ctx.restore();

      // Chart-Box
      const cx = 120, cw = CW-240, cyTop = 780, cyBot = 1400;
      ctx.setLineDash([4, 16]);
      for(let g=0; g<4; g++){
        const gy = cyTop + (cyBot-cyTop)*g/3;
        ctx.strokeStyle = 'rgba(120,124,134,.35)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, gy); ctx.lineTo(cx+cw, gy); ctx.stroke();
      }
      ctx.setLineDash([]);

      const pts = [0.06, 0.10, 0.17, 0.24, 0.34, 0.52, 0.74, 1.0];
      const e2  = appleOut(clamp01((time - (T_LINE+0.25))/1.25));
      const idx = e2*(pts.length-1);
      const i0 = Math.min(pts.length-2, Math.floor(idx));
      const frac = idx - i0;

      ctx.beginPath();
      for(let i=0;i<=i0;i++){
        const px = cx + cw*i/(pts.length-1), py = cyBot - (cyBot-cyTop-40)*pts[i];
        i===0 ? ctx.moveTo(px,py) : ctx.quadraticCurveTo(
          cx + cw*(i-0.5)/(pts.length-1), cyBot - (cyBot-cyTop-40)*pts[i-1], px, py);
      }
      const lx = cx + cw*idx/(pts.length-1);
      const lyv = pts[i0] + (pts[i0+1]-pts[i0])*frac;
      const ly = cyBot - (cyBot-cyTop-40)*lyv;
      ctx.quadraticCurveTo(cx + cw*(i0+0.5)/(pts.length-1), cyBot - (cyBot-cyTop-40)*pts[i0], lx, ly);

      ctx.strokeStyle = CYAN; ctx.lineWidth = 7; ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.stroke();
      const gr = ctx.createLinearGradient(0, cyTop, 0, cyBot);
      gr.addColorStop(0, 'rgba(0,229,255,.22)'); gr.addColorStop(1, 'rgba(0,229,255,0)');
      ctx.lineTo(lx, cyBot); ctx.lineTo(cx, cyBot); ctx.closePath();
      ctx.fillStyle = gr; ctx.fill();

      if(idx > 0.001){
        ctx.beginPath(); ctx.arc(lx, ly, 10, 0, Math.PI*2);
        ctx.fillStyle = CYAN; ctx.fill();
        ctx.beginPath(); ctx.arc(lx, ly, 10 + 14*appleOut(clamp01((time-(T_LINE+1.5))/0.35)), 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(0,229,255,.5)'; ctx.lineWidth = 3; ctx.stroke();
      }

      ctx.save();
      setFont(400, 30, true);
      ctx.letterSpacing = '10px';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(90,94,104,.9)';
      ctx.textAlign = 'left';
      ctx.fillText('524K+ TOTAL', cx, cyTop - 60);
      ctx.textAlign = 'right';
      ctx.fillText('VIEWS / TAG', cx+cw, cyBot + 70);
      ctx.restore();
      ctx.restore();
    }
  }

  // ---- Bar-Chart (black) ----
  if(time > T_BARS - 0.12 && time < T_BARS_END + 0.25){
    const a = fadeInOut(time, T_BARS+0.05, T_BARS_END, 0.24, 0.24);
    if(a > 0){
      ctx.save();
      ctx.globalAlpha = a;
      centerText('REICHWEITE. POST FÜR POST.', CW/2, 430, 34, CYAN, {mono:true, weight:700, track:10, alpha:a});

      const vals = [22, 30, 26, 38, 54, 82];
      const bW = 96, gap = (CW - 240 - 6*bW)/5, baseY = 1440, maxH = 720;
      for(let i=0;i<6;i++){
        const e = appleOut(clamp01((time - (T_BARS+0.10 + i*0.14))/0.4));
        if(e <= 0) continue;
        const h = maxH*(vals[i]/100)*e;
        const x = 120 + i*(bW+gap);
        ctx.fillStyle = i===5 ? CYAN : 'rgba(255,255,255,.16)';
        roundRect(x, baseY-h, bW, h, 14);
        ctx.fill();
        if(e > 0.95){
          centerText(vals[i]+'%', x+bW/2, baseY-h-55, 34, i===5 ? CYAN : 'rgba(230,232,238,.85)', {mono:true, weight:700, alpha:a*0.9});
        }
      }
      const lastE = appleOut(clamp01((time - (T_BARS+0.10+5*0.14))/0.4));
      if(lastE > 0.9){
        centerText('HEUTE', 120+5*(bW+gap)+bW/2, baseY+70, 30, CYAN, {mono:true, weight:700, track:30, alpha:a});
      }
      ctx.restore();
    }
  }

  // ---- Endcard ----
  if(time > T_END){
    const a  = clamp01((time - T_END)/0.30);
    const a1 = clamp01((time - T_END - 0.28)/0.30);
    const a2 = clamp01((time - T_END - 0.46)/0.30);
    const a3 = clamp01((time - T_END - 0.64)/0.30);
    const e  = appleOut(clamp01((time - T_END)/0.42));
    const sc = 1.10 - 0.10*e;
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(CW/2, 830); ctx.scale(sc, sc);
    ctx.textAlign='left'; ctx.textBaseline='middle';
    setFont(800, 110, false);
    ctx.letterSpacing='1px';
    const wA = ctx.measureText('MOTION').width;
    const wB = ctx.measureText('//MEDIA').width;
    const st = -(wA+wB)/2;
    ctx.fillStyle = '#fff'; ctx.fillText('MOTION', st, 0);
    ctx.fillStyle = CYAN; ctx.fillText('//MEDIA', st+wA, 0);
    ctx.restore();
    if(a1 > 0) centerText('MADE WITH PURPOSE.', CW/2, 1030, 46, CYAN, {weight:700, mono:false, track:14, alpha:a1});
    if(a2 > 0) centerText('524K+ VIEWS  ·  +'+GROWTH_PCT+'%', CW/2, 1140, 26, 'rgba(255,255,255,.4)', {mono:true, weight:400, track:10, alpha:a2});
    if(a3 > 0) centerText('@motionmedia', CW/2, 1470, 34, GRAY, {mono:true, weight:400, track:30, alpha:a3});
  }

  // dezente Vignette
  const vg = ctx.createRadialGradient(CW/2, CH/2, CH*0.32, CW/2, CH/2, CH*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,CW,CH);
}
function roundRect(x, y, w, h, r){
  r = Math.min(r, w/2, Math.abs(h)/2);
  if(h < 2*r) r = h/2;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* ================================================================
   RECORD -> webm (Video + Musik/SFX gemischt)
================================================================ */
let recorder = null;
document.getElementById('recBtn').onclick = () => {
  ensureAudio();
  if(recorder && recorder.state === 'recording'){ recorder.stop(); return; }
  const btn = document.getElementById('recBtn');
  if(t < 0.05 || t >= DUR - 0.5){ t = 0; }

  const vStream = cv.captureStream(30);
  const tracks = [...vStream.getVideoTracks(), streamDest.stream.getAudioTracks()[0]];
  const stream = new MediaStream(tracks);

  const mime = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
    .find(m=>MediaRecorder.isTypeSupported(m)) || '';
  recorder = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:14_000_000});
  const chunks = [];
  recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, {type:'video/webm'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'MOTIONMEDIA_VIEWS_AD.webm';
    a.click();
    btn.classList.remove('active'); btn.textContent = '● record → webm';
    recorder = null;
  };
  recorder.start();
  btn.classList.add('active'); btn.textContent = '⏺ rendering… (15s + Musik)';

  t = 0; playing = true; last = performance.now();
  syncEvIdx();
  playBtn.textContent = '⏸ pause';
  const wait = setInterval(() => {
    if(t >= DUR || (!playing && t > 0.2)){
      clearInterval(wait);
      if(recorder && recorder.state === 'recording') recorder.stop();
    }
  }, 100);
};

/* fit canvas on screen */
function fit(){
  const k = Math.min(window.innerWidth/CW, (window.innerHeight-70)/CH);
  cv.style.width  = Math.round(CW*k)+'px';
  cv.style.height = Math.round(CH*k)+'px';
}
window.addEventListener('resize', fit); fit();

document.getElementById('startBtn').onclick = () => {
  ensureAudio();
  document.getElementById('startOverlay').classList.add('hidden');
  t = 0; playing = true; last = performance.now();
  syncEvIdx();
};

/* first frame */
loadFontReady.then(()=>{ render(0); });
if(!raf) raf = requestAnimationFrame(loop);
</script>
